basePath: /api/v1
definitions:
  admin.AccountDTO:
    properties:
      active_days:
        description: ActiveDays is on how many of the last 30 days they used Helpic.
        type: integer
      blocked_at:
        description: BlockedAt is when an admin blocked them; null when they aren't.
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_active:
        description: LastActive is the last day they used Helpic, YYYY-MM-DD; null
          if never.
        type: string
      name:
        type: string
      projects:
        type: integer
      role:
        type: string
      tasks:
        type: integer
      two_factor:
        type: boolean
    type: object
  admin.AccountDetailDTO:
    properties:
      active_days:
        description: ActiveDays is on how many of the last 30 days they used Helpic.
        type: integer
      active_on:
        items:
          type: string
        type: array
      active_since:
        description: |-
          ActiveSince is the Monday 26 weeks back; ActiveOn the days since then
          they used Helpic, YYYY-MM-DD, oldest first.
        type: string
      blocked_at:
        description: BlockedAt is when an admin blocked them; null when they aren't.
        type: string
      comments:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      email:
        type: string
      id:
        type: string
      last_active:
        description: LastActive is the last day they used Helpic, YYYY-MM-DD; null
          if never.
        type: string
      last_sign_in:
        type: string
      locale:
        type: string
      name:
        type: string
      partners:
        description: Partners are a freelancer's clients, or a client's freelancers.
        type: integer
      projects:
        type: integer
      reports_paid:
        type: integer
      reports_sent:
        type: integer
      role:
        type: string
      seconds_logged:
        type: integer
      sessions:
        description: Sessions are their signed-in devices now.
        type: integer
      tasks:
        type: integer
      team:
        $ref: '#/definitions/admin.TeamDTO'
      telegram:
        type: boolean
      two_factor:
        type: boolean
    type: object
  admin.ActionDTO:
    properties:
      action:
        description: Action is block, unblock, end_sessions or reset_two_factor.
        type: string
      admin_email:
        type: string
      admin_id:
        description: AdminID and TargetID are null once the account is gone; the emails
          stay.
        type: string
      at:
        type: string
      id:
        type: integer
      reason:
        type: string
      target_email:
        type: string
      target_id:
        type: string
    type: object
  admin.ActionRequest:
    properties:
      reason:
        description: Reason says why, for the record; optional, at most 500 characters.
        type: string
    type: object
  admin.ActionsResponse:
    properties:
      actions:
        items:
          $ref: '#/definitions/admin.ActionDTO'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  admin.CheckDTO:
    properties:
      error:
        type: string
      latency_ms:
        type: integer
      name:
        description: Name is database, mail or telegram.
        type: string
      state:
        description: State is ok, failing or off (left out of the config).
        type: string
    type: object
  admin.DayDTO:
    properties:
      active:
        type: integer
      day:
        description: Day is YYYY-MM-DD in the app's time zone.
        type: string
      signups:
        type: integer
      tasks_completed:
        type: integer
      tasks_created:
        type: integer
    type: object
  admin.EmailCountsDTO:
    properties:
      failed:
        type: integer
      last_sent:
        description: LastSent is when an email last went out; null when none has lately.
        type: string
      queued:
        type: integer
      sent:
        type: integer
    type: object
  admin.EmailDTO:
    properties:
      attempts:
        type: integer
      created_at:
        type: string
      id:
        type: string
      last_error:
        type: string
      next_attempt_at:
        description: NextAttemptAt is when a queued email is tried next.
        type: string
      sent_at:
        type: string
      status:
        description: Status is queued, failed or sent.
        type: string
      subject:
        type: string
      to:
        type: string
    type: object
  admin.EmailsResponse:
    properties:
      counts:
        $ref: '#/definitions/admin.EmailCountsDTO'
      emails:
        items:
          $ref: '#/definitions/admin.EmailDTO'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  admin.JobDTO:
    properties:
      failures:
        type: integer
      interval_seconds:
        type: integer
      last_error:
        type: string
      last_run:
        type: string
      last_success:
        type: string
      name:
        type: string
      running:
        type: boolean
      runs:
        type: integer
      state:
        description: |-
          State is ok, failing (the last run failed), late (it hasn't run again
          in time) or waiting (not run yet).
        type: string
    type: object
  admin.LogDTO:
    properties:
      at:
        type: string
      attrs:
        additionalProperties: {}
        description: |-
          Attrs are what was logged with it: for a request the method, route,
          status, duration, IP and who made it; for a failure the error.
        type: object
      id:
        type: integer
      level:
        type: string
      message:
        type: string
    type: object
  admin.LogsResponse:
    properties:
      errors:
        type: integer
      limit:
        type: integer
      logs:
        items:
          $ref: '#/definitions/admin.LogDTO'
        type: array
      page:
        type: integer
      total:
        type: integer
      warnings:
        description: Warnings and Errors are counted over the last 24 hours, whatever
          the filter.
        type: integer
    type: object
  admin.PeriodDTO:
    properties:
      active:
        description: Active is how many people used Helpic on any of the days.
        type: integer
      new_users:
        type: integer
      tasks_completed:
        type: integer
      tasks_created:
        type: integer
    type: object
  admin.SignupDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_error:
        type: string
      email_status:
        description: |-
          EmailStatus is how the newest email to the address went: queued,
          failed or sent; empty once it is no longer kept.
        type: string
      expires_at:
        type: string
      locale:
        type: string
      name:
        type: string
    type: object
  admin.SignupsResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      signups:
        items:
          $ref: '#/definitions/admin.SignupDTO'
        type: array
      total:
        type: integer
    type: object
  admin.StatsResponse:
    properties:
      days:
        items:
          $ref: '#/definitions/admin.DayDTO'
        type: array
      from:
        description: From and To are the period's first and last day, YYYY-MM-DD.
        type: string
      period:
        $ref: '#/definitions/admin.PeriodDTO'
      previous:
        $ref: '#/definitions/admin.PeriodDTO'
      previous_days:
        description: PreviousDays is the period before, as long, to compare with.
        items:
          $ref: '#/definitions/admin.DayDTO'
        type: array
      to:
        type: string
      totals:
        $ref: '#/definitions/admin.TotalsDTO'
    type: object
  admin.SystemResponse:
    properties:
      checks:
        items:
          $ref: '#/definitions/admin.CheckDTO'
        type: array
      emails:
        $ref: '#/definitions/admin.EmailCountsDTO'
      go_version:
        type: string
      jobs:
        items:
          $ref: '#/definitions/admin.JobDTO'
        type: array
      started_at:
        type: string
      version:
        type: string
    type: object
  admin.TeamDTO:
    properties:
      members:
        type: integer
      name:
        type: string
      role:
        description: Role is owner, member or contractor.
        type: string
    type: object
  admin.TotalsDTO:
    properties:
      active_day:
        type: integer
      active_month:
        type: integer
      active_week:
        type: integer
      clients:
        type: integer
      freelancers:
        type: integer
      pending_signups:
        type: integer
      projects:
        type: integer
      tasks:
        type: integer
      two_factor:
        type: integer
      users:
        type: integer
    type: object
  admin.UsersResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/admin.AccountDTO'
        type: array
    type: object
  attachments.DTO:
    properties:
      can_delete:
        description: CanDelete is true for the uploader.
        type: boolean
      content_type:
        type: string
      created_at:
        type: string
      file_name:
        type: string
      id:
        type: string
      is_image:
        description: IsImage marks a picture the browser may preview.
        type: boolean
      size_bytes:
        type: integer
      task_id:
        type: string
      uploaded_by:
        $ref: '#/definitions/attachments.UploaderDTO'
    type: object
  attachments.ListResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/attachments.DTO'
        type: array
      max_size_bytes:
        type: integer
    type: object
  attachments.UploaderDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  auth.ForgotRequest:
    properties:
      email:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      code:
        description: |-
          Code is asked for once the password is right, when the account has
          two-factor on: six digits from the app, or a recovery code.
        type: string
      email:
        type: string
      password:
        type: string
    type: object
  auth.PasswordConfirmRequest:
    properties:
      current_password:
        type: string
    type: object
  auth.RecoveryCodesDTO:
    properties:
      recovery_codes:
        items:
          type: string
        type: array
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      password_confirmation:
        type: string
    type: object
  auth.ResetRequest:
    properties:
      password:
        type: string
      password_confirmation:
        type: string
      token:
        type: string
    type: object
  auth.SessionDTO:
    properties:
      created_at:
        type: string
      current:
        type: boolean
      expires_at:
        type: string
      id:
        type: string
      ip:
        type: string
      last_used_at:
        type: string
      user_agent:
        type: string
    type: object
  auth.SignupConfirmRequest:
    properties:
      token:
        type: string
    type: object
  auth.TwoFactorChangeRequest:
    properties:
      code:
        type: string
      current_password:
        type: string
    type: object
  auth.TwoFactorCodeRequest:
    properties:
      code:
        type: string
    type: object
  auth.TwoFactorDTO:
    properties:
      enabled:
        type: boolean
      recovery_codes_left:
        description: RecoveryCodesLeft is how many unused recovery codes there are;
          0 while off.
        type: integer
    type: object
  auth.TwoFactorOnDTO:
    properties:
      recovery_codes:
        items:
          type: string
        type: array
      user:
        $ref: '#/definitions/user.DTO'
    type: object
  auth.TwoFactorSetupDTO:
    properties:
      qr:
        description: 'QR is an SVG image of URI, as a data: URL.'
        type: string
      secret:
        description: Secret is for typing in by hand, base32.
        type: string
      uri:
        description: URI is the otpauth:// link the QR code carries.
        type: string
    type: object
  board.BoardDTO:
    properties:
      can_manage:
        description: |-
          CanManage is true for the author of the project the board was opened
          for, and on a pair's board for its freelancer.
        type: boolean
      columns:
        items:
          $ref: '#/definitions/board.ColumnDTO'
        type: array
      merged:
        description: |-
          Merged is true for the all board: its columns are lanes merging the
          pairs' columns of one name, moved to with MoveRequest.Lane.
        type: boolean
    type: object
  board.ColumnDTO:
    properties:
      category:
        type: string
      id:
        type: string
      name:
        type: string
      participants_can_move:
        type: boolean
      status_category:
        type: string
      tasks:
        items:
          $ref: '#/definitions/tasks.DTO'
        type: array
    type: object
  board.ColumnRequest:
    properties:
      name:
        type: string
      project_id:
        type: string
      status_category:
        type: string
      with:
        type: string
    type: object
  board.LabelDTO:
    properties:
      color:
        type: string
      id:
        type: string
      name:
        type: string
      task_count:
        type: integer
    type: object
  board.LabelRequest:
    properties:
      color:
        type: string
      name:
        type: string
      project_id:
        type: string
      with:
        type: string
    type: object
  board.LabelsResponse:
    properties:
      colors:
        items:
          type: string
        type: array
      labels:
        items:
          $ref: '#/definitions/board.LabelDTO'
        type: array
    type: object
  board.MoveRequest:
    properties:
      after_task_id:
        description: |-
          AfterTaskID is the card the moved one goes right after; empty puts it
          at the top of the column.
        type: string
      column_id:
        type: string
      lane:
        description: Lane, instead of ColumnID, moves the card to a lane of the all
          board.
        type: string
      task_id:
        type: string
    type: object
  board.OrderRequest:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  clients.AcceptRequest:
    properties:
      code:
        type: string
      name:
        type: string
      password:
        type: string
      password_confirmation:
        type: string
      token:
        type: string
    type: object
  clients.InvitationDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      expired:
        type: boolean
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  clients.InviteRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  clients.LinkDTO:
    properties:
      email:
        type: string
      id:
        type: string
      linked_at:
        type: string
      name:
        type: string
      open_tasks:
        type: integer
    type: object
  clients.LookupDTO:
    properties:
      account_exists:
        type: boolean
      email:
        type: string
      expires_at:
        type: string
      freelancer:
        $ref: '#/definitions/clients.PartyDTO'
      name:
        type: string
    type: object
  clients.LookupRequest:
    properties:
      token:
        type: string
    type: object
  clients.PartyDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  comments.AuthorDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  comments.DTO:
    properties:
      author:
        $ref: '#/definitions/comments.AuthorDTO'
      body:
        type: string
      can_edit:
        description: CanEdit is true for the author, who may edit and delete it.
        type: boolean
      created_at:
        type: string
      edited:
        type: boolean
      id:
        type: string
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  comments.Request:
    properties:
      body:
        type: string
    type: object
  notifications.ActorDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  notifications.DTO:
    properties:
      actor:
        $ref: '#/definitions/notifications.ActorDTO'
      created_at:
        type: string
      detail:
        type: string
      id:
        type: string
      kind:
        type: string
      project_id:
        type: string
      read:
        type: boolean
      report_id:
        type: string
      subject:
        type: string
      task_id:
        type: string
    type: object
  notifications.EmailKindsRequest:
    properties:
      kinds:
        items:
          type: string
        type: array
    type: object
  notifications.EmailPrefsDTO:
    properties:
      available:
        description: |-
          Available are the kinds that can be emailed; DefaultKinds those on
          until the user chooses.
        items:
          type: string
        type: array
      default_kinds:
        items:
          type: string
        type: array
      kinds:
        description: Kinds are emailed; none means no email.
        items:
          type: string
        type: array
    type: object
  notifications.ListResponse:
    properties:
      notifications:
        items:
          $ref: '#/definitions/notifications.DTO'
        type: array
      unread:
        type: integer
    type: object
  profile.ConfirmEmailRequest:
    properties:
      token:
        type: string
    type: object
  profile.CurrencyRequest:
    properties:
      currency:
        type: string
    type: object
  profile.EmailRequest:
    properties:
      current_password:
        type: string
      email:
        type: string
    type: object
  profile.LocaleRequest:
    properties:
      locale:
        type: string
    type: object
  profile.NameRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    type: object
  profile.PasswordRequest:
    properties:
      current_password:
        type: string
      password:
        type: string
      password_confirmation:
        type: string
    type: object
  profile.PendingEmailDTO:
    properties:
      pending_email:
        type: string
    type: object
  profile.RateRequest:
    properties:
      rate:
        type: string
    type: object
  projects.DTO:
    properties:
      can_edit:
        type: boolean
      can_set_rate:
        description: |-
          CanSetRate is true for a freelancer on the project; MyHourlyRateCents
          is the rate they set on it (null: their own rate applies).
        type: boolean
      client:
        $ref: '#/definitions/projects.PartyDTO'
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      freelancer:
        $ref: '#/definitions/projects.PartyDTO'
      id:
        type: string
      my_hourly_rate_cents:
        type: integer
      name:
        type: string
      open_tasks:
        type: integer
      participants:
        items:
          $ref: '#/definitions/projects.PartyDTO'
        type: array
      total_tasks:
        type: integer
      updated_at:
        type: string
    type: object
  projects.InviteRequest:
    properties:
      user_id:
        type: string
      user_ids:
        items:
          type: string
        type: array
    type: object
  projects.PartyDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  projects.PersonDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        description: Role is "freelancer", "owner", "member" or "contractor".
        type: string
    type: object
  projects.RateRequest:
    properties:
      rate:
        type: string
    type: object
  projects.Request:
    properties:
      client_id:
        type: string
      description:
        type: string
      freelancer_id:
        type: string
      freelancer_ids:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  reports.CreateRequest:
    properties:
      client_id:
        type: string
      from:
        type: string
      kind:
        description: Kind is "basic" (the default) or "detailed".
        type: string
      project_id:
        description: ProjectID is the one-project form of ProjectIDs, still accepted.
        type: string
      project_ids:
        description: ProjectIDs limits the report to these projects; none means all.
        items:
          type: string
        type: array
      summary:
        type: string
      title:
        type: string
      to:
        type: string
    type: object
  reports.DTO:
    properties:
      can_delete:
        description: CanDelete is true for the freelancer while the report is a draft.
        type: boolean
      can_edit:
        description: CanEdit is true for the freelancer while the report is a draft.
        type: boolean
      can_mark_paid:
        description: CanMarkPaid is true for the client of a sent, unpaid report.
        type: boolean
      client:
        allOf:
        - $ref: '#/definitions/reports.PartyDTO'
        description: Client is null for a report on personal work.
      created_at:
        type: string
      currency:
        type: string
      freelancer:
        $ref: '#/definitions/reports.PartyDTO'
      from:
        type: string
      id:
        type: string
      in_uah:
        allOf:
        - $ref: '#/definitions/reports.InUAHDTO'
        description: |-
          InUAH is the total in hryvnias at the NBU's official rate, on a single
          report in another currency; null otherwise, or when no rate is known.
      item_count:
        type: integer
      items:
        items:
          $ref: '#/definitions/reports.ItemDTO'
        type: array
      kind:
        type: string
      paid_at:
        type: string
      projects:
        description: Projects the report covers, named as they were; empty means all.
        items:
          $ref: '#/definitions/reports.ProjectRef'
        type: array
      sent_at:
        type: string
      status:
        type: string
      summary:
        type: string
      title:
        type: string
      to:
        type: string
      total_cents:
        description: |-
          TotalCents sums the items' prices, on a list too; null when none
          has a price.
        type: integer
      updated_at:
        type: string
    type: object
  reports.EventDTO:
    properties:
      actor:
        $ref: '#/definitions/reports.PartyDTO'
      created_at:
        type: string
      data:
        additionalProperties: {}
        type: object
      id:
        type: string
      kind:
        type: string
    type: object
  reports.InUAHDTO:
    properties:
      rate:
        description: 'Rate is hryvnias for one unit of the report''s currency: "45.0256".'
        type: string
      rate_on:
        description: |-
          RateOn is the day the National Bank of Ukraine set the rate for: the
          day the report was paid, or today while it isn't (or the latest day
          before, when the bank can't be reached).
        type: string
      total_cents:
        type: integer
    type: object
  reports.ItemDTO:
    properties:
      completed_on:
        type: string
      id:
        type: string
      notes:
        description: Notes say what was done in the task (shown in a detailed report).
        type: string
      price_cents:
        description: PriceCents is null for a task without a price.
        type: integer
      price_in_uah_cents:
        description: |-
          PriceInUAHCents is the price in hryvnias at the report's rate (see
          in_uah), each rounded on its own; null without a price or a rate.
        type: integer
      project_name:
        type: string
      seconds:
        description: Seconds is the time a task billed by the hour took; null for
          a fixed price.
        type: integer
      status_name:
        type: string
      task_id:
        type: string
      title:
        type: string
    type: object
  reports.ItemRequest:
    properties:
      notes:
        type: string
    type: object
  reports.ListResponse:
    properties:
      reports:
        items:
          $ref: '#/definitions/reports.DTO'
        type: array
    type: object
  reports.PartyDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  reports.ProjectRef:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  reports.UpdateRequest:
    properties:
      kind:
        description: Kind switches between "basic" and "detailed"; omitted, it stays.
        type: string
      summary:
        type: string
      title:
        type: string
    type: object
  response.APIError:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  response.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/response.APIError'
    type: object
  tasks.ArchiveResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      tasks:
        items:
          $ref: '#/definitions/tasks.DTO'
        type: array
      total:
        type: integer
    type: object
  tasks.DTO:
    properties:
      archived_at:
        description: |-
          ArchivedAt is set once the task is archived: off the boards and closed
          to changes. ArchivedBy is the paid report that archived it, null when
          its owner did.
        type: string
      archived_by:
        $ref: '#/definitions/tasks.ReportDTO'
      billed:
        description: |-
          Billed is true once the task is on a sent report: its time and an
          hourly price stay as they were billed.
        type: boolean
      billing:
        description: |-
          Billing is "fixed" or "hourly": then the price is TrackedSeconds at
          HourlyRateCents. Like the price, the time and the rate are null for
          whoever doesn't see the price.
        type: string
      can_archive:
        description: |-
          CanArchive is true on the viewer's own personal task, which they may
          put in the archive by hand.
        type: boolean
      can_delete:
        type: boolean
      can_edit:
        type: boolean
      can_see_price:
        description: |-
          CanSeePrice is false for a member of the client's team: the price is
          left out for them.
        type: boolean
      can_set_price:
        type: boolean
      can_track_time:
        description: CanTrackTime is true for the task's freelancer, who writes time
          on it.
        type: boolean
      client:
        allOf:
        - $ref: '#/definitions/tasks.PartyDTO'
        description: Client is null for a personal task.
      created_at:
        type: string
      created_by:
        type: string
      creator:
        allOf:
        - $ref: '#/definitions/tasks.PartyDTO'
        description: |-
          Creator is who set the task — the freelancer, the client, or a member
          of the client's company.
      currency:
        type: string
      description:
        type: string
      due_on:
        type: string
      freelancer:
        allOf:
        - $ref: '#/definitions/tasks.PartyDTO'
        description: Freelancer is null while the task has no assignee.
      hourly_rate_cents:
        type: integer
      id:
        type: string
      labels:
        items:
          $ref: '#/definitions/tasks.Label'
        type: array
      next_statuses:
        items:
          type: string
        type: array
      participants:
        description: |-
          Participants are who took part: the freelancer first, then everyone who
          set, commented on, attached to or changed the task.
        items:
          $ref: '#/definitions/tasks.PartyDTO'
        type: array
      position:
        type: integer
      price_cents:
        description: |-
          PriceCents is null while the task has no price; Currency is the
          freelancer's.
        type: integer
      priority:
        type: string
      project:
        allOf:
        - $ref: '#/definitions/tasks.ProjectDTO'
        description: Project is null for a task outside any project.
      status:
        type: string
      status_id:
        description: |-
          Status is the category; StatusID and StatusName the exact workflow
          status (board column), Position the card's place in it.
        type: string
      status_name:
        type: string
      title:
        type: string
      tracked_seconds:
        type: integer
      updated_at:
        type: string
    type: object
  tasks.EventDTO:
    properties:
      actor:
        $ref: '#/definitions/tasks.PartyDTO'
      created_at:
        type: string
      data:
        additionalProperties: {}
        type: object
      id:
        type: string
      kind:
        type: string
    type: object
  tasks.Label:
    properties:
      color:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  tasks.LabelsRequest:
    properties:
      label_ids:
        items:
          type: string
        type: array
    type: object
  tasks.ParticipantRequest:
    properties:
      user_id:
        type: string
    type: object
  tasks.PartyDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  tasks.PersonDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      on_task:
        description: OnTask is whether they're a participant already.
        type: boolean
      role:
        description: Role is "owner", "member" or "contractor".
        type: string
    type: object
  tasks.PriceRequest:
    properties:
      billing:
        type: string
      price:
        type: string
    type: object
  tasks.PriorityRequest:
    properties:
      priority:
        type: string
    type: object
  tasks.ProjectDTO:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  tasks.ReportDTO:
    properties:
      id:
        type: string
      title:
        type: string
    type: object
  tasks.Request:
    properties:
      client_id:
        type: string
      description:
        type: string
      due_on:
        type: string
      freelancer_id:
        type: string
      personal:
        description: |-
          Personal makes a task with no other side: a client's own (a freelancer's
          is made by leaving client_id empty). Create only.
        type: boolean
      price:
        description: |-
          Price is an amount like "1200.50", set by a freelancer on create only;
          PUT /api/v1/tasks/{id}/price changes it later.
        type: string
      priority:
        description: |-
          Priority is set on create only ("none" when left out); PUT
          /api/v1/tasks/{id}/priority changes it later.
        type: string
      project_id:
        description: |-
          ProjectID puts the task in a project; on edit null keeps the current
          project and "" takes the task out of it.
        type: string
      status_id:
        description: StatusID creates the task straight in a board column (create
          only).
        type: string
      title:
        type: string
    type: object
  tasks.StatusRequest:
    properties:
      status:
        description: |-
          Status moves the task to the first column of a category; StatusID to an
          exact column.
        type: string
      status_id:
        type: string
    type: object
  team.InviteDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      expired:
        type: boolean
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  team.InviteRequest:
    properties:
      email:
        type: string
      name:
        type: string
      role:
        description: Role is "member" (the default) or "contractor".
        type: string
    type: object
  team.JoinRequest:
    properties:
      name:
        type: string
      password:
        type: string
      password_confirmation:
        type: string
      token:
        type: string
    type: object
  team.LookupDTO:
    properties:
      company:
        type: string
      email:
        type: string
      expires_at:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/team.PersonDTO'
      role:
        description: 'Role is what they join as: "member" or "contractor".'
        type: string
    type: object
  team.LookupRequest:
    properties:
      token:
        type: string
    type: object
  team.MemberDTO:
    properties:
      email:
        type: string
      id:
        type: string
      joined_at:
        type: string
      name:
        type: string
      role:
        description: Role is "member" or "contractor".
        type: string
    type: object
  team.NameRequest:
    properties:
      name:
        type: string
    type: object
  team.OverviewDTO:
    properties:
      invites:
        items:
          $ref: '#/definitions/team.InviteDTO'
        type: array
      members:
        items:
          $ref: '#/definitions/team.MemberDTO'
        type: array
      name:
        type: string
      owner:
        $ref: '#/definitions/team.PersonDTO'
      role:
        type: string
    type: object
  team.PersonDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  team.RoleRequest:
    properties:
      role:
        description: Role is "member" or "contractor".
        type: string
    type: object
  telegram.ConnectDTO:
    properties:
      expires_at:
        type: string
      url:
        type: string
    type: object
  telegram.KindsRequest:
    properties:
      kinds:
        items:
          type: string
        type: array
    type: object
  telegram.StatusDTO:
    properties:
      available:
        description: |-
          Available are the kinds that can go to Telegram; DefaultKinds those on
          when a chat is connected.
        items:
          type: string
        type: array
      connected:
        type: boolean
      default_kinds:
        items:
          type: string
        type: array
      enabled:
        description: Enabled is false when the server has no bot.
        type: boolean
      kinds:
        items:
          type: string
        type: array
      linked_at:
        type: string
      username:
        description: Username is the connected Telegram account's @handle, or its
          first name.
        type: string
    type: object
  timelog.DTO:
    properties:
      can_edit:
        description: CanEdit is true for the author, who may change and delete it.
        type: boolean
      created_at:
        type: string
      id:
        type: string
      note:
        type: string
      running_since:
        type: string
      seconds:
        description: |-
          Seconds is the time so far; while RunningSince is set the timer adds
          the time since then.
        type: integer
      spent_on:
        type: string
      task_id:
        type: string
      task_title:
        type: string
      user:
        $ref: '#/definitions/timelog.UserDTO'
    type: object
  timelog.Request:
    properties:
      duration:
        description: Duration is like "1:30", "1h 30m", "45m" or "1.5" (hours).
        type: string
      note:
        type: string
      spent_on:
        description: SpentOn is the day, YYYY-MM-DD.
        type: string
    type: object
  timelog.UserDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  user.DTO:
    properties:
      created_at:
        type: string
      currency:
        type: string
      email:
        type: string
      first_name:
        type: string
      hourly_rate_cents:
        description: HourlyRateCents is a freelancer's rate for an hour of work; null
          when unset.
        type: integer
      id:
        type: string
      last_name:
        type: string
      locale:
        description: 'Locale is the language they read Helpic in: "en" or "uk".'
        type: string
      member_of:
        allOf:
        - $ref: '#/definitions/user.TeamDTO'
        description: MemberOf is set for a member of a client's company; null otherwise.
      name:
        type: string
      role:
        type: string
      two_factor:
        description: TwoFactor is on when signing in also takes a code from an authenticator
          app.
        type: boolean
    type: object
  user.Response:
    properties:
      user:
        $ref: '#/definitions/user.DTO'
    type: object
  user.TeamDTO:
    properties:
      name:
        type: string
      owner_id:
        type: string
      role:
        description: |-
          Role is "member" (sees all the company's work) or "contractor" (only
          the tasks they set or were added to).
        type: string
    type: object
info:
  contact: {}
  description: |-
    Freelancers and their clients on the same page: tasks, projects, boards, reports.

    Sign in with POST /auth/login: it sets an httpOnly cookie that every other call sends.
    In this UI, sign in first and the cookie goes along with the next requests.
    Errors come as {"error": {"code", "message", "fields"}}.
  title: Helpic API
  version: "1.0"
paths:
  /admin/actions:
    get:
      description: Every action admins took on accounts, the newest first, a page
        at a time. Nothing is ever taken out of it.
      parameters:
      - description: Only the actions on this account
        in: query
        name: target
        type: string
      - description: The page, from 1
        in: query
        name: page
        type: integer
      - description: Actions per page, 25 by default, at most 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ActionsResponse'
        "400":
          description: Invalid page or limit
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: What admins did
      tags:
      - admin
  /admin/emails:
    get:
      description: 'The emails Helpic sent or is sending, the newest first, kept for
        a week: whom to, the subject and how sending went. Never the body, which can
        hold one-time links.'
      parameters:
      - description: queued, failed or sent
        in: query
        name: status
        type: string
      - description: Part of the address or the subject
        in: query
        name: q
        type: string
      - description: The page, from 1
        in: query
        name: page
        type: integer
      - description: Emails per page, 25 by default, at most 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.EmailsResponse'
        "400":
          description: Invalid status, page or limit
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Outgoing email
      tags:
      - admin
  /admin/emails/{id}/retry:
    post:
      description: 'Sends an email that wasn''t sent on the next run, with a fresh
        set of tries, and records it. A sent email can''t be: its body is gone.'
      parameters:
      - description: Email ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: email, as it is now
          schema:
            additionalProperties:
              $ref: '#/definitions/admin.EmailDTO'
            type: object
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: No such email, or it was sent
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Send an email again
      tags:
      - admin
  /admin/logs:
    get:
      description: 'The last 30 days, the newest first: failed requests, panics, background
        jobs. A page at a time, with how many match in all. Requests show their route,
        never the path.'
      parameters:
      - description: warn or error
        in: query
        name: level
        type: string
      - description: Part of the message or of any attribute
        in: query
        name: q
        type: string
      - description: The page, from 1
        in: query
        name: page
        type: integer
      - description: Entries per page, 50 by default, at most 200
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.LogsResponse'
        "400":
          description: Invalid level, page or limit
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: The server's warnings and errors
      tags:
      - admin
  /admin/signups:
    get:
      description: Public sign-ups that haven't opened their confirmation link and
        haven't expired, the newest first, with how the newest email to the address
        went.
      parameters:
      - description: Part of the email or the name
        in: query
        name: q
        type: string
      - description: The page, from 1
        in: query
        name: page
        type: integer
      - description: Sign-ups per page, 25 by default, at most 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.SignupsResponse'
        "400":
          description: Invalid page or limit
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Sign-ups waiting
      tags:
      - admin
  /admin/signups/{email}:
    delete:
      description: Removes a sign-up nobody confirmed, so its link stops working,
        and records it. The address can sign up again.
      parameters:
      - description: The sign-up's email
        in: path
        name: email
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: No sign-up waiting for this email
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Remove a sign-up
      tags:
      - admin
  /admin/signups/{email}/resend:
    post:
      description: Emails a new confirmation link, good for 24 hours, in the language
        the sign-up was made in, and records it. The old link stops working.
      parameters:
      - description: The sign-up's email
        in: path
        name: email
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: No sign-up waiting for this email
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Send a sign-up its link again
      tags:
      - admin
  /admin/stats:
    get:
      description: Totals now; the last days (today included) against the days before
        them, also day by day. Days are the app's time zone's. Counts only, never
        anyone's content.
      parameters:
      - description: The period, 7 to 365 days; 30 by default
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.StatsResponse'
        "400":
          description: Invalid period
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: How Helpic is used
      tags:
      - admin
  /admin/system:
    get:
      description: Checks the database, the mail server and the Telegram bot on the
        spot, and tells how this server's background jobs ran since it started and
        how the outgoing email stands.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.SystemResponse'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: System status
      tags:
      - admin
  /admin/users:
    get:
      description: 'Every account, the newest first: who they are and how much they
        use Helpic. A page at a time, with how many match in all.'
      parameters:
      - description: Part of the email or the name
        in: query
        name: q
        type: string
      - description: freelancer or client
        in: query
        name: role
        type: string
      - description: active (in the last 7 days), idle (not in the last 30), never
          or blocked
        in: query
        name: activity
        type: string
      - description: created (newest first, the default), last_active or tasks
        in: query
        name: sort
        type: string
      - description: The page, from 1
        in: query
        name: page
        type: integer
      - description: Accounts per page, 25 by default, at most 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.UsersResponse'
        "400":
          description: Invalid role, activity, sort, page or limit
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Accounts
      tags:
      - admin
  /admin/users/{id}:
    get:
      description: 'One account in full: its team, how much it has done (counts only)
        and the days it used Helpic over the last 26 weeks.'
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: user
          schema:
            additionalProperties:
              $ref: '#/definitions/admin.AccountDetailDTO'
            type: object
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: No such account
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: An account
      tags:
      - admin
  /admin/users/{id}/{action}:
    post:
      consumes:
      - application/json
      description: block stops the account signing in and signs it out; unblock lets
        it in again; end-sessions signs it out everywhere; reset-two-factor turns
        its two-factor sign-in off, signs it out and emails it. Each is recorded with
        the reason when it changes something; doing it again changes nothing. Admins'
        accounts can't be acted on.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: block, unblock, end-sessions or reset-two-factor
        in: path
        name: action
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/admin.ActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: user, as it is now
          schema:
            additionalProperties:
