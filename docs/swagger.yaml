          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: A task's files
      tags:
      - attachments
    post:
      consumes:
      - multipart/form-data
      description: Multipart, one "file" part, up to MAX_UPLOAD_MB. The type is read
        from the bytes. With a virus scanner set up the file comes back with scan
        "pending" and downloads once it is checked.
      parameters:
      - description: Task ID
        in: query
        name: task
        required: true
        type: string
      - description: The file
        in: formData
        name: file
        required: true
