basePath: /api/v1
definitions:
  admin.AccountDTO:
    properties:
      active_days:
        description: ActiveDays is on how many of the last 30 days they used Helpic.
        type: integer
      blocked_at:
        description: BlockedAt is when an admin blocked them; null when they aren't.
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_active:
        description: LastActive is the last day they used Helpic, YYYY-MM-DD; null
          if never.
        type: string
      name:
        type: string
      projects:
        type: integer
      role:
        type: string
      tasks:
        type: integer
      two_factor:
        type: boolean
    type: object
  admin.AccountDetailDTO:
    properties:
      active_days:
        description: ActiveDays is on how many of the last 30 days they used Helpic.
        type: integer
      active_on:
        items:
          type: string
        type: array
      active_since:
        description: |-
          ActiveSince is the Monday 26 weeks back; ActiveOn the days since then
          they used Helpic, YYYY-MM-DD, oldest first.
        type: string
      blocked_at:
        description: BlockedAt is when an admin blocked them; null when they aren't.
        type: string
      comments:
        type: integer
      created_at:
        type: string
      currency:
        type: string
      email:
        type: string
      files:
        description: |-
          Files are what they uploaded to tasks, FilesBytes how much;
          QuotaBytes is how much they may, 0 for no limit.
        type: integer
      files_bytes:
        type: integer
      id:
        type: string
      last_active:
        description: LastActive is the last day they used Helpic, YYYY-MM-DD; null
          if never.
        type: string
      last_sign_in:
        type: string
      locale:
        type: string
      name:
        type: string
      partners:
        description: Partners are a freelancer's clients, or a client's freelancers.
        type: integer
      projects:
        type: integer
      quota_bytes:
        type: integer
      reports_paid:
        type: integer
      reports_sent:
        type: integer
      role:
        type: string
      seconds_logged:
        type: integer
      sessions:
        description: Sessions are their signed-in devices now.
        type: integer
      tasks:
        type: integer
      team:
        $ref: '#/definitions/admin.TeamDTO'
      telegram:
        type: boolean
      two_factor:
        type: boolean
    type: object
  admin.ActionDTO:
    properties:
      action:
        description: Action is block, unblock, end_sessions, reset_two_factor or delete.
        type: string
      admin_email:
        type: string
      admin_id:
        description: AdminID and TargetID are null once the account is gone; the emails
          stay.
        type: string
      at:
        type: string
      id:
        type: integer
      reason:
        type: string
      target_email:
        type: string
      target_id:
        type: string
    type: object
  admin.ActionRequest:
    properties:
      code:
        description: |-
          Code is the admin's two-factor code, asked again for every change to
          an account: a session someone else got hold of can't make one.
        type: string
      reason:
        description: Reason says why, for the record; optional, at most 500 characters.
        type: string
    type: object
  admin.ActionsResponse:
    properties:
      actions:
        items:
          $ref: '#/definitions/admin.ActionDTO'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  admin.AdminDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      last_sign_in:
        type: string
      name:
        type: string
      sessions:
        items:
          $ref: '#/definitions/admin.SessionDTO'
        type: array
      two_factor:
        type: boolean
    type: object
  admin.CheckDTO:
    properties:
      error:
        type: string
      latency_ms:
        type: integer
      name:
        description: Name is database, mail, telegram or alerts.
        type: string
      state:
        description: State is ok, failing or off (left out of the config).
        type: string
    type: object
  admin.ClearLimitRequest:
    properties:
      key:
        type: string
      scope:
        type: string
    type: object
  admin.DayDTO:
    properties:
      active:
        type: integer
      day:
        description: Day is YYYY-MM-DD in the app's time zone.
        type: string
      signups:
        type: integer
      tasks_completed:
        type: integer
      tasks_created:
        type: integer
    type: object
  admin.DiskDTO:
    properties:
      free_bytes:
        type: integer
      total_bytes:
        type: integer
    type: object
  admin.EmailCountsDTO:
    properties:
      failed:
        type: integer
      last_sent:
        description: LastSent is when an email last went out; null when none has lately.
        type: string
      queued:
        type: integer
      sent:
        type: integer
    type: object
  admin.EmailDTO:
    properties:
      attempts:
        type: integer
      created_at:
        type: string
      id:
        type: string
      last_error:
        type: string
      next_attempt_at:
        description: NextAttemptAt is when a queued email is tried next.
        type: string
      sent_at:
        type: string
      status:
        description: Status is queued, failed or sent.
        type: string
      subject:
        type: string
      to:
        type: string
    type: object
  admin.EmailsResponse:
    properties:
      counts:
        $ref: '#/definitions/admin.EmailCountsDTO'
      emails:
        items:
          $ref: '#/definitions/admin.EmailDTO'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  admin.FilesDTO:
    properties:
      bytes:
        type: integer
      count:
        type: integer
    type: object
  admin.JobDTO:
    properties:
      failures:
        type: integer
      interval_seconds:
        type: integer
      last_error:
        type: string
      last_run:
        type: string
      last_success:
        type: string
      name:
        type: string
      running:
        type: boolean
      runs:
        type: integer
      state:
        description: |-
          State is ok, failing (the last run failed), late (it hasn't run again
          in time) or waiting (not run yet).
        type: string
    type: object
  admin.LimitDTO:
    properties:
      account_email:
        type: string
      account_id:
        description: |-
          AccountID and AccountEmail are the account it holds back; null and
          empty when there is none.
        type: string
      burst:
        description: Burst attempts are let through at once, then one every EverySeconds.
        type: integer
      email:
        type: string
      every_seconds:
        type: number
      ip:
        type: string
      key:
        type: string
      kind:
        description: 'Kind is what the key is: ip, email, email_ip or user.'
        type: string
      opens_at:
        type: string
      scope:
        description: |-
          Scope is the limit: sign-in, sign-up, refresh, login-failures,
          login-failures-email, password-checks, two-factor-codes, reset,
          reset-email, invites or shared.
        type: string
    type: object
  admin.LogDTO:
    properties:
      at:
        type: string
      attrs:
        additionalProperties: {}
        description: |-
          Attrs are what was logged with it: for a request the method, route,
          status, duration, IP and who made it; for a failure the error.
        type: object
      id:
        type: integer
      level:
        type: string
      message:
        type: string
    type: object
  admin.LogsResponse:
    properties:
      errors:
        type: integer
      limit:
        type: integer
      logs:
        items:
          $ref: '#/definitions/admin.LogDTO'
        type: array
      page:
        type: integer
      total:
        type: integer
      warnings:
        description: Warnings and Errors are counted over the last 24 hours, whatever
          the filter.
        type: integer
    type: object
  admin.PeriodDTO:
    properties:
      active:
        description: Active is how many people used Helpic on any of the days.
        type: integer
      new_users:
        type: integer
      tasks_completed:
        type: integer
      tasks_created:
        type: integer
    type: object
  admin.SessionDTO:
    properties:
      created_at:
        type: string
      id:
        type: string
      ip:
        type: string
      last_used_at:
        type: string
      user_agent:
        type: string
    type: object
  admin.SignInDTO:
    properties:
      admin_email:
        type: string
      admin_id:
        description: AdminID is null once the account is gone; the email stays.
        type: string
      at:
        type: string
      id:
        type: integer
      ip:
        type: string
      outcome:
        description: |-
          Outcome is ok, wrong_password, wrong_code or limited (too many wrong
          codes before).
        type: string
      user_agent:
        type: string
    type: object
  admin.SignInsResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      sign_ins:
        items:
          $ref: '#/definitions/admin.SignInDTO'
        type: array
      total:
        type: integer
    type: object
  admin.SignupDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_error:
        type: string
      email_status:
        description: |-
          EmailStatus is how the newest email to the address went: queued,
          failed or sent; empty once it is no longer kept.
        type: string
      expires_at:
        type: string
      locale:
        type: string
      name:
        type: string
    type: object
  admin.SignupsResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      signups:
        items:
          $ref: '#/definitions/admin.SignupDTO'
        type: array
      total:
        type: integer
    type: object
  admin.StatsResponse:
    properties:
      days:
        items:
          $ref: '#/definitions/admin.DayDTO'
        type: array
      from:
        description: From and To are the period's first and last day, YYYY-MM-DD.
        type: string
      period:
        $ref: '#/definitions/admin.PeriodDTO'
      previous:
        $ref: '#/definitions/admin.PeriodDTO'
      previous_days:
        description: PreviousDays is the period before, as long, to compare with.
        items:
          $ref: '#/definitions/admin.DayDTO'
        type: array
      to:
        type: string
      totals:
        $ref: '#/definitions/admin.TotalsDTO'
    type: object
  admin.SystemResponse:
    properties:
      checks:
        items:
          $ref: '#/definitions/admin.CheckDTO'
        type: array
      disk:
        allOf:
        - $ref: '#/definitions/admin.DiskDTO'
        description: Disk is null when the server can't read it.
      files:
        $ref: '#/definitions/admin.FilesDTO'
      go_version:
        type: string
      jobs:
        items:
          $ref: '#/definitions/admin.JobDTO'
        type: array
      started_at:
        type: string
      version:
        type: string
    type: object
  admin.TeamDTO:
    properties:
      members:
        type: integer
      name:
        type: string
      role:
        description: Role is owner, member or contractor.
        type: string
    type: object
  admin.TotalsDTO:
    properties:
      active_day:
        type: integer
      active_month:
        type: integer
      active_week:
        type: integer
      clients:
        type: integer
      freelancers:
        type: integer
      pending_signups:
        type: integer
      projects:
        type: integer
      tasks:
        type: integer
      two_factor:
        type: integer
      users:
        type: integer
    type: object
  admin.UsersResponse:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/admin.AccountDTO'
        type: array
    type: object
  attachments.DTO:
    properties:
      can_delete:
        description: CanDelete is true for the uploader.
        type: boolean
      content_type:
        type: string
      created_at:
        type: string
      file_name:
        type: string
      id:
        type: string
      is_image:
        description: IsImage marks a picture the browser may preview.
        type: boolean
      scan:
        description: |-
          Scan is the check for malware: "pending" doesn't download yet,
          "infected" never does (Threat names what was found); "clean" and
          "unscanned" (stored without a scanner) download.
        enum:
        - pending
        - clean
        - infected
        - unscanned
        type: string
      size_bytes:
        type: integer
      task_id:
        type: string
      threat:
        type: string
      uploaded_by:
        $ref: '#/definitions/attachments.UploaderDTO'
    type: object
  attachments.ListResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/attachments.DTO'
        type: array
      max_size_bytes:
        type: integer
    type: object
  attachments.UploaderDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  auth.ForgotRequest:
    properties:
      email:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      code:
        description: |-
          Code is asked for once the password is right, when the account has
          two-factor on: six digits from the app, or a recovery code.
        type: string
      email:
        type: string
      password:
        type: string
    type: object
  auth.PasswordConfirmRequest:
    properties:
      current_password:
        type: string
    type: object
  auth.RecoveryCodesDTO:
    properties:
      recovery_codes:
        items:
          type: string
        type: array
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      password_confirmation:
        type: string
      role:
        enum:
        - freelancer
        - client
        type: string
    type: object
  auth.ResetRequest:
    properties:
      password:
        type: string
      password_confirmation:
        type: string
      token:
        type: string
    type: object
  auth.SessionDTO:
    properties:
      created_at:
        type: string
      current:
        type: boolean
      expires_at:
        type: string
      id:
        type: string
      ip:
        type: string
      last_used_at:
        type: string
      user_agent:
        type: string
    type: object
  auth.SignupConfirmRequest:
    properties:
      token:
        type: string
    type: object
  auth.TwoFactorChangeRequest:
    properties:
      code:
        type: string
      current_password:
        type: string
    type: object
  auth.TwoFactorCodeRequest:
    properties:
      code:
        type: string
    type: object
  auth.TwoFactorDTO:
    properties:
      enabled:
        type: boolean
      recovery_codes_left:
        description: RecoveryCodesLeft is how many unused recovery codes there are;
          0 while off.
        type: integer
    type: object
  auth.TwoFactorOnDTO:
    properties:
      recovery_codes:
        items:
          type: string
        type: array
      user:
        $ref: '#/definitions/user.DTO'
    type: object
  auth.TwoFactorSetupDTO:
    properties:
      qr:
        description: 'QR is an SVG image of URI, as a data: URL.'
        type: string
      secret:
        description: Secret is for typing in by hand, base32.
        type: string
      uri:
        description: URI is the otpauth:// link the QR code carries.
        type: string
    type: object
  board.BoardDTO:
    properties:
      can_manage:
        description: |-
          CanManage is true for the author of the project the board was opened
          for, and on a pair's board for its freelancer.
        type: boolean
      columns:
        items:
          $ref: '#/definitions/board.ColumnDTO'
        type: array
      merged:
        description: |-
          Merged is true for the all board: its columns are lanes merging the
          pairs' columns of one name, moved to with MoveRequest.Lane.
        type: boolean
    type: object
  board.ColumnDTO:
    properties:
      category:
        type: string
      id:
        type: string
      name:
        type: string
      participants_can_move:
        type: boolean
      status_category:
        type: string
      tasks:
        items:
          $ref: '#/definitions/tasks.DTO'
        type: array
    type: object
  board.ColumnRequest:
    properties:
      name:
        type: string
      project_id:
        type: string
      status_category:
        type: string
      with:
        type: string
    type: object
  board.LabelDTO:
    properties:
      color:
        type: string
      id:
        type: string
      name:
        type: string
      task_count:
        type: integer
    type: object
  board.LabelRequest:
    properties:
      color:
        type: string
      name:
        type: string
      project_id:
        type: string
      with:
        type: string
    type: object
  board.LabelsResponse:
    properties:
      colors:
        items:
          type: string
        type: array
      labels:
        items:
          $ref: '#/definitions/board.LabelDTO'
        type: array
    type: object
  board.MoveRequest:
    properties:
      after_task_id:
        description: |-
          AfterTaskID is the card the moved one goes right after; empty puts it
          at the top of the column.
        type: string
      column_id:
        type: string
      lane:
        description: Lane, instead of ColumnID, moves the card to a lane of the all
          board.
        type: string
      task_id:
        type: string
    type: object
  board.OrderRequest:
    properties:
      ids:
        items:
          type: string
        type: array
    type: object
  branding.DTO:
    properties:
      color:
        type: string
      details:
        type: string
      logo_id:
        description: |-
          LogoID changes with every new logo, so its address can be cached;
          null without one.
        type: string
    type: object
  branding.Request:
    properties:
      color:
        description: Color is "#rrggbb"; null or "" for none.
        type: string
      details:
        type: string
    type: object
  branding.Response:
    properties:
      branding:
        $ref: '#/definitions/branding.DTO'
    type: object
  clients.AcceptRequest:
    properties:
      code:
        type: string
      name:
        type: string
      password:
        type: string
      password_confirmation:
        type: string
      token:
        type: string
    type: object
  clients.FreelancerLookupDTO:
    properties:
      account_exists:
        type: boolean
      client:
        $ref: '#/definitions/clients.PartyDTO'
      company:
        type: string
      email:
        type: string
      expires_at:
        type: string
      name:
        type: string
    type: object
  clients.InvitationDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      expired:
        type: boolean
      expires_at:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  clients.InviteRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  clients.LinkDTO:
    properties:
      email:
        type: string
      id:
        type: string
      linked_at:
        type: string
      name:
        type: string
      open_tasks:
        type: integer
    type: object
  clients.LookupDTO:
    properties:
      account_exists:
        type: boolean
      email:
        type: string
      expires_at:
        type: string
      freelancer:
        $ref: '#/definitions/clients.PartyDTO'
      name:
        type: string
    type: object
  clients.LookupRequest:
    properties:
      token:
        type: string
    type: object
  clients.PartyDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  comments.AuthorDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  comments.DTO:
    properties:
      author:
        $ref: '#/definitions/comments.AuthorDTO'
      body:
        type: string
      can_edit:
        description: CanEdit is true for the author, who may edit and delete it.
        type: boolean
      created_at:
        type: string
      edited:
        type: boolean
      id:
        type: string
      task_id:
        type: string
      updated_at:
        type: string
    type: object
  comments.PersonDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  comments.Request:
    properties:
      body:
        type: string
    type: object
  notifications.ActorDTO:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  notifications.AppPrefsDTO:
    properties:
      available:
        description: |-
          Available are the kinds it can show; DefaultKinds those on until the
          user chooses: all of them.
        items:
          type: string
        type: array
      default_kinds:
        items:
          type: string
        type: array
      kinds:
        description: Kinds show in the bell.
        items:
          type: string
        type: array
    type: object
  notifications.DTO:
    properties:
      actor:
        $ref: '#/definitions/notifications.ActorDTO'
      created_at:
        type: string
      detail:
        type: string
      id:
        type: string
      kind:
        type: string
      project_id:
        type: string
      read:
        type: boolean
      report_id:
        type: string
      subject:
        type: string
      task_id:
        type: string
    type: object
  notifications.EmailKindsRequest:
    properties:
      kinds:
        items:
          type: string
        type: array
    type: object
  notifications.EmailPrefsDTO:
    properties:
      available:
        description: |-
          Available are the kinds that can be emailed; DefaultKinds those on
          until the user chooses.
        items:
          type: string
        type: array
      default_kinds:
        items:
          type: string
        type: array
      kinds:
        description: Kinds are emailed; none means no email.
        items:
          type: string
        type: array
    type: object
  notifications.ListResponse:
    properties:
      notifications:
        items:
          $ref: '#/definitions/notifications.DTO'
        type: array
      unread:
        type: integer
    type: object
  policies.AdminPolicyDTO:
    properties:
      body:
        description: |-
          Body is plain lines: "## " a heading, "- " a list item, an empty line
          between paragraphs.
        type: string
      custom:
        description: Custom is whether an admin wrote it; otherwise it is Helpic's
          own.
        type: boolean
      kind:
        description: Kind is privacy, terms or cookies.
        type: string
      locale:
        type: string
      updated_at:
        type: string
      updated_by:
        description: |-
          UpdatedBy is the admin's email; empty for the default or once the
          account is gone.
        type: string
    type: object
  policies.PolicyDTO:
    properties:
      body:
        description: |-
          Body is plain lines: "## " a heading, "- " a list item, an empty line
          between paragraphs.
        type: string
      custom:
        description: Custom is whether an admin wrote it; otherwise it is Helpic's
          own.
        type: boolean
      kind:
        description: Kind is privacy, terms or cookies.
        type: string
      locale:
        type: string
      updated_at:
        type: string
    type: object
  policies.SaveRequest:
    properties:
      body:
        type: string
    type: object
  profile.ConfirmEmailRequest:
    properties:
      token:
        type: string
    type: object
  profile.CurrencyRequest:
    properties:
      currency:
        type: string
    type: object
  profile.DeleteAccountRequest:
    properties:
      code:
        description: |-
          Code is asked for when the account has two-factor on: six digits from
          the app, or a recovery code.
        type: string
      current_password:
        type: string
    type: object
