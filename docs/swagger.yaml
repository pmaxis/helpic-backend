  /auth/login:
    post:
      consumes:
      - application/json
      description: Sets the httpOnly auth cookie that every other endpoint reads.
        An account with two-factor on answers a right password without a code with
        403 TWO_FACTOR_REQUIRED; send the same again with the code.
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.Response'
        "400":
          description: Invalid input, or a wrong code (field code)
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Wrong email or password
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: The password is right; the account also needs a code (TWO_FACTOR_REQUIRED)
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "429":
          description: Too many attempts from this address, wrong passwords for this
            email, or wrong codes for this account
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Sign in
      tags:
      - auth
  /auth/logout:
    post:
      description: Ends this device's session and clears the auth cookies.
      responses:
        "204":
          description: Signed out
      summary: Sign out
      tags:
      - auth
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: Emails a one-time link to the account with this email. The answer
        is the same whether there is one or not.
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotRequest'
      responses:
        "204":
          description: Sent, if there is such an account
        "400":
          description: Invalid email
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "429":
          description: Too many attempts from this address
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Ask for a password reset link
      tags:
      - auth
  /auth/password/reset:
    post:
      consumes:
      - application/json
      description: Signs out every device; sign in with the new password.
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ResetRequest'
      responses:
        "204":
          description: Password set
        "400":
          description: Invalid password, or the link is invalid, used or expired (field
            token)
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "429":
          description: Too many attempts from this address
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Set a new password with a reset link
      tags:
      - auth
  /auth/refresh:
    post:
      description: Swaps the refresh cookie for a new one and sets a new access cookie.
        A refresh token used again after it was replaced ends the session.
      responses:
        "204":
          description: Refreshed
        "401":
          description: No session, or it ended
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "429":
          description: Too many refreshes from this address
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Refresh the session
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Emails a confirmation link. The account is created when that link
        is opened, not before. An email that already has an account gets a note saying
        so instead; the answer is the same, so it doesn't tell who has an account.
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Confirmation emailed; no account yet
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "429":
          description: Too many sign-ups from this address
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Sign up as a freelancer
      tags:
      - auth
  /auth/signups/confirm:
    post:
      consumes:
      - application/json
      description: Creates the freelancer account and signs this browser in. The link
