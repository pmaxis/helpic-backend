        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not allowed
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Delete a file
      tags:
      - attachments
    get:
      description: Always as a download, except PNG/JPEG/GIF/WebP images with inline=1.
        A file still being checked for viruses (scan "pending") or found infected
        answers 409.
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      - description: 1 to show a safe image in place
        in: query
        name: inline
