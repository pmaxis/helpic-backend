info:
  contact: {}
  description: |-
    Freelancers and their clients on the same page: tasks, projects, boards, reports.

    Sign in with POST /auth/login: it sets an httpOnly cookie that every other call sends.
    In this UI, sign in first and the cookie goes along with the next requests.
    Errors come as {"error": {"code", "message", "fields"}}.
  title: Helpic API
  version: "1.0"
paths:
  /admin/actions:
    get:
      description: Every action admins took on accounts, the newest first, a page
        at a time. Nothing is ever taken out of it.
      parameters:
      - description: Only the actions on this account
        in: query
        name: target
        type: string
      - description: The page, from 1
        in: query
        name: page
        type: integer
      - description: Actions per page, 25 by default, at most 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.ActionsResponse'
        "400":
          description: Invalid page or limit
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not an admin, or two-factor is off
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: What admins did
      tags:
      - admin
  /admin/admins:
    get:
      description: Every admin account, the oldest first, with its last sign-in and
        the devices it is signed in on. Admins are made with cli create-admin only.
      produces:
      - application/json
      responses:
        "200":
          description: admins
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/admin.AdminDTO'
              type: array
            type: object
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
