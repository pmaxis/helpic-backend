          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "413":
          description: Too large
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Attach a file to a task
      tags:
