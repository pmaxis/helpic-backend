info:
  contact: {}
  description: |-
    Freelancers and their clients on the same page: tasks, projects, boards, reports.

    Sign in with POST /auth/login: it sets an httpOnly cookie that every other call sends.
    In this UI, sign in first and the cookie goes along with the next requests.
    Errors come as {"error": {"code", "message", "fields"}}.
  title: Helpic API
  version: "1.0"
paths:
  /attachments:
    get:
      parameters:
      - description: Task ID
        in: query
        name: task
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/attachments.ListResponse'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: A task's files
      tags:
      - attachments
    post:
      consumes:
      - multipart/form-data
      description: Multipart, one "file" part, up to MAX_UPLOAD_MB. The type is read
        from the bytes.
      parameters:
      - description: Task ID
        in: query
        name: task
        required: true
        type: string
      - description: The file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: attachment
          schema:
            additionalProperties:
              $ref: '#/definitions/attachments.DTO'
            type: object
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "413":
          description: Too large
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Attach a file to a task
      tags:
      - attachments
  /attachments/{id}:
    delete:
      description: Its uploader only.
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No content
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "403":
          description: Not allowed
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Delete a file
      tags:
      - attachments
    get:
      description: Always as a download, except PNG/JPEG/GIF/WebP images with inline=1.
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      - description: 1 to show a safe image in place
        in: query
        name: inline
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: The file
          schema:
            type: file
        "401":
          description: Not signed in
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Download a file
      tags:
      - attachments
  /auth/login:
    post:
      consumes:
      - application/json
      description: Sets the httpOnly auth cookie that every other endpoint reads.
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/user.Response'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "401":
          description: Wrong email or password
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
        "429":
          description: Too many attempts from this address, or wrong passwords for
            this email
          schema:
            $ref: '#/definitions/response.ErrorEnvelope'
      summary: Sign in
      tags:
      - auth
  /auth/logout:
    post:
      description: Ends this device's session and clears the auth cookies.
      responses:
        "204":
          description: Signed out
      summary: Sign out
      tags:
      - auth
  /auth/password/forgot:
    post:
      consumes:
      - application/json
      description: Emails a one-time link to the account with this email. The answer
        is the same whether there is one or not.
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotRequest'
      responses:
        "204":
          description: Sent, if there is such an account
        "400":
