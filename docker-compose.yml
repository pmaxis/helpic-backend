name: helpic-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-helpic}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-helpic}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/helpic?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      REFRESH_EXPIRATION: ${REFRESH_EXPIRATION:-720h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5180}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_NAME: ${COOKIE_NAME:-auth_token}
      COOKIE_PATH: ${COOKIE_PATH:-/}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      APP_URL: ${APP_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RATE_LIMIT: ${RATE_LIMIT:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
