name: helpic-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-helpic}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-helpic}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Catches every email the backend sends in development; read them at
  # http://localhost:8025. Nothing leaves your machine.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  # Browse the database at http://localhost:8088 (server is filled in; the
  # user and password are POSTGRES_USER and POSTGRES_PASSWORD).
  adminer:
    image: adminer:5
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8088}:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/helpic?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      REFRESH_EXPIRATION: ${REFRESH_EXPIRATION:-720h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5180}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_NAME: ${COOKIE_NAME:-auth_token}
      COOKIE_PATH: ${COOKIE_PATH:-/}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      UPLOAD_QUOTA_MB: ${UPLOAD_QUOTA_MB:-1024}
      APP_URL: ${APP_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RATE_LIMIT: ${RATE_LIMIT:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      REMINDER_HOUR: ${REMINDER_HOUR:-9}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Helpic <no-reply@helpic.local>}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres_data:
  uploads:
